[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "pos-platform-backend"
version = "1.0.0"
description = "POS Platform Business Data Plane API (Cloud Multi-Tenant & Private Single-Tenant)"
readme = "../../README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.29.0",
    "sqlalchemy>=2.0.25",
    "alembic>=1.13.0",
    "pydantic>=2.6.0",
    "PyJWT>=2.8.0",
    "bcrypt>=3.2.0",
    "PyNaCl>=1.5.0",
    "httpx>=0.27.0",
    "psycopg2-binary>=2.9.9",
]

[tool.pyrefly]
search-path = [".", "../.."]


