name: Build POS Android APK

on:
  push:
    branches: [main]
    paths:
      - "apps/pos-mobile/**"
      - ".github/workflows/flutter-apk.yml"
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/pos-mobile

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.24.5"
          channel: "stable"
          cache: true

      - name: Generate Android platform files & configure LAN HTTP permissions
        run: |
          if [ ! -d "android" ]; then
            flutter create --platforms=android --org com.posplatform --project-name pos_mobile .
          fi
          python3 - << 'PY'
          from pathlib import Path
          manifest = Path("android/app/src/main/AndroidManifest.xml")
          text = manifest.read_text(encoding="utf-8")
          if 'android.permission.INTERNET' not in text:
              text = text.replace(
                  "<application",
                  '    <uses-permission android:name="android.permission.INTERNET"/>\n    <application',
                  1,
              )
          if 'android:usesCleartextTraffic' not in text:
              text = text.replace(
                  "<application",
                  '<application\n        android:usesCleartextTraffic="true"',
                  1,
              )
          manifest.write_text(text, encoding="utf-8")
          PY

      - name: Install Dart dependencies
        run: flutter pub get

      - name: Analyze Dart code
        run: flutter analyze --no-fatal-infos

      - name: Build Release APK
        run: flutter build apk --release

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: pos-android-terminal-apk
          path: apps/pos-mobile/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30
