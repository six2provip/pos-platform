services:
  postgres-business:
    image: postgres:16.15-alpine
    container_name: pos-postgres-business
    environment:
      POSTGRES_DB: pos_business
      POSTGRES_USER: pos_migrator
      POSTGRES_PASSWORD: ${BUSINESS_DB_PASSWORD:-dev_business_password_change_me}
    ports:
      - "127.0.0.1:${BUSINESS_DB_PORT:-15432}:5432"
    volumes:
      - postgres_business_data:/var/lib/postgresql/data
      - ./database/seeds/init-business-roles.sql:/docker-entrypoint-initdb.d/01-init-roles.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pos_migrator -d pos_business"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  postgres-control:
    image: postgres:16.15-alpine
    container_name: pos-postgres-control
    environment:
      POSTGRES_DB: pos_control
      POSTGRES_USER: control_migrator
      POSTGRES_PASSWORD: ${CONTROL_DB_PASSWORD:-dev_control_password_change_me}
    ports:
      - "127.0.0.1:${CONTROL_DB_PORT:-15433}:5432"
    volumes:
      - postgres_control_data:/var/lib/postgresql/data
      - ./database/seeds/init-control-roles.sql:/docker-entrypoint-initdb.d/01-init-roles.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U control_migrator -d pos_control"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: pos-redis
    ports:
      - "127.0.0.1:${REDIS_PORT:-16379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  pos-control-plane:
    build:
      context: .
      dockerfile: apps/control-plane/Dockerfile
    container_name: pos-control-plane
    depends_on:
      postgres-control:
        condition: service_healthy
    environment:
      CONTROL_DATABASE_URL: postgresql+psycopg2://control_migrator:${CONTROL_DB_PASSWORD:-dev_control_password_change_me}@postgres-control:5432/pos_control
      PYTHONPATH: /workspace:/workspace/apps/control-plane
    volumes:
      - ./licensing:/workspace/licensing
      - ./apps/control-plane:/workspace/apps/control-plane
    ports:
      - "127.0.0.1:${CONTROL_API_PORT:-18001}:8001"
    restart: unless-stopped

  pos-backend:
    build:
      context: .
      dockerfile: apps/backend/Dockerfile
    container_name: pos-backend
    depends_on:
      postgres-business:
        condition: service_healthy
      redis:
        condition: service_healthy
      pos-control-plane:
        condition: service_started
    environment:
      APP_ENV: development
      DEPLOYMENT_MODE: cloud
      TENANT_MODE: multi
      AUTO_SEED_DEMO: "true"
      DATABASE_URL: postgresql+psycopg2://pos_migrator:${BUSINESS_DB_PASSWORD:-dev_business_password_change_me}@postgres-business:5432/pos_business
      REDIS_URL: redis://redis:6379/0
      PUBLIC_BASE_URL: http://127.0.0.1:18000
      CLOUD_CONTROL_PLANE_URL: http://pos-control-plane:8001
      PYTHONPATH: /workspace:/workspace/apps/backend
    volumes:
      - ./licensing:/workspace/licensing
      - ./apps/backend:/workspace/apps/backend
    ports:
      - "127.0.0.1:${BUSINESS_API_PORT:-18000}:8000"
    restart: unless-stopped

  pos-organization-web:
    image: node:20-slim
    container_name: pos-organization-web
    working_dir: /workspace/apps/organization-web
    depends_on:
      - pos-backend
    environment:
      NEXT_PUBLIC_API_BASE_URL: http://pos-backend:8000
      NODE_ENV: development
    volumes:
      - .:/workspace
    command: ["npm", "run", "dev"]
    ports:
      - "${ORG_WEB_PORT:-13000}:13000"
    restart: unless-stopped

  pos-super-admin-web:
    image: node:20-slim
    container_name: pos-super-admin-web
    working_dir: /workspace/apps/super-admin-web
    depends_on:
      - pos-control-plane
      - pos-backend
    environment:
      NEXT_PUBLIC_CONTROL_BASE_URL: http://pos-control-plane:8001
      NEXT_PUBLIC_API_BASE_URL: http://pos-backend:8000
      NODE_ENV: development
    volumes:
      - .:/workspace
    command: ["npm", "run", "dev"]
    ports:
      - "127.0.0.1:${SUPER_ADMIN_WEB_PORT:-13001}:13001"
    restart: unless-stopped

volumes:
  postgres_business_data: {}
  postgres_control_data: {}
